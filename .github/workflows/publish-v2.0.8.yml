# One-time stable release publisher. Remove this file after verified publication.
# GitHub connector cannot create tags directly; this runs on a main branch push
# containing THIS exact file, then uses the repository's stable signing secrets.
name: Publish signed v2.0.8 (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2.0.8.yml']
permissions:
  contents: write
concurrency:
  group: signed-v2.0.8-once
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: v2.0.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify exactly the approved version and missing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -Fx '        versionCode = 14' app/build.gradle.kts
          grep -Fx '        versionName = "2.0.8"' app/build.gradle.kts
          test -s "docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; do not republish."
            exit 1
          fi
          git fetch --tags --quiet
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
      - name: Restore original stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIGRIS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigris.keystore"
      - name: Test and build stable-signed Standard and Guard APKs
        env:
          TIGRIS_KEYSTORE: ${{ runner.temp }}/tigris.keystore
          TIGRIS_STORE_PASSWORD: ${{ secrets.TIGRIS_STORE_PASSWORD }}
          TIGRIS_KEY_PASSWORD: ${{ secrets.TIGRIS_KEY_PASSWORD }}
          TIGRIS_KEY_ALIAS: ${{ secrets.TIGRIS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash tools/test-install.sh
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          bash ./gradlew --no-daemon testStandardDebugUnitTest testGuardDebugUnitTest assembleStandardRelease assembleGuardRelease lintStandardRelease lintGuardRelease
      - name: Verify package ID, version, stable certificate and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/Tigris-$RELEASE_TAG.apk"
          cp app/build/outputs/apk/guard/release/app-guard-release.apk "dist/Tigris-guard-$RELEASE_TAG.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            head -n 1 "$RUNNER_TEMP/badging.txt" | grep -F "name='com.leslie.tvhome'" | grep -F "versionCode='14'" | grep -F "versionName='2.0.8'"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
            grep -F '7d2b6be8a86ce8981e368dde4920869b90c8206137934a6d1fc89a2d1d1b6114' "$RUNNER_TEMP/cert.txt"
          done
          (cd dist && sha256sum "Tigris-$RELEASE_TAG.apk" "Tigris-guard-$RELEASE_TAG.apk" > "SHA256SUMS-$RELEASE_TAG.txt")
      - name: Create release tag at this verified main commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$TAG_SHA" ]; then
            test "$TAG_SHA" = "$GITHUB_SHA" || { echo "::error::Tag points elsewhere"; exit 1; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Tigris-$RELEASE_TAG.apk" \
            "dist/Tigris-guard-$RELEASE_TAG.apk" \
            "dist/SHA256SUMS-$RELEASE_TAG.txt" \
            --verify-tag --title "Tigris 2.0.8" \
            --notes-file "docs/releases/$RELEASE_TAG.md" --latest
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,assets,isDraft,isPrerelease --jq '.tagName'
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = false
          for asset in "Tigris-$RELEASE_TAG.apk" "Tigris-guard-$RELEASE_TAG.apk" "SHA256SUMS-$RELEASE_TAG.txt"; do
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$asset"
          done
      - name: Erase signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tigris.keystore"
