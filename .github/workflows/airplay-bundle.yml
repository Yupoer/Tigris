name: Tigris with AirPlay Direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - airplay-direct/**
      - tools/build-with-airplay.sh
      - tools/install-with-airplay.sh
      - tools/resolve-adb-tv.sh
      - .github/workflows/airplay-bundle.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platforms
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0' --channel=3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build launcher and receiver
        run: bash tools/build-with-airplay.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tigris-airplay-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
