name: Publish fork OTA release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fork-ota-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Yupoer/Tigris'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select version and skip an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          test -s "docs/releases/$TAG.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'
      - name: Install Android SDK
        if: steps.version.outputs.exists == 'false'
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore fork signing key
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.TIGRIS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tigris.keystore"
      - name: Test and build signed packages
        if: steps.version.outputs.exists == 'false'
        env:
          TIGRIS_KEYSTORE: ${{ runner.temp }}/tigris.keystore
          TIGRIS_STORE_PASSWORD: ${{ secrets.TIGRIS_STORE_PASSWORD }}
          TIGRIS_KEY_PASSWORD: ${{ secrets.TIGRIS_KEY_PASSWORD }}
          TIGRIS_KEY_ALIAS: ${{ secrets.TIGRIS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bash tools/test-install.sh
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          bash ./gradlew --no-daemon testStandardDebugUnitTest testGuardDebugUnitTest assembleStandardRelease assembleGuardRelease lintStandardRelease lintGuardRelease
      - name: Verify installed-app signing identity
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/Tigris-$TAG.apk"
          cp app/build/outputs/apk/guard/release/app-guard-release.apk "dist/Tigris-guard-$TAG.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            head -n 1 "$RUNNER_TEMP/badging.txt" | grep -F "name='com.leslie.tvhome'" | grep -F "versionName='$VERSION'"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
            grep -F '61fdf73a8170adcd617b58e5ef3e45ea58d8de464365e32e76f52af2c6566c6d' "$RUNNER_TEMP/cert.txt"
          done
          (cd dist && sha256sum "Tigris-$TAG.apk" "Tigris-guard-$TAG.apk" > "SHA256SUMS-$TAG.txt")
      - name: Publish update for Tigris's built-in updater
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/Tigris-$TAG.apk" "dist/Tigris-guard-$TAG.apk" "dist/SHA256SUMS-$TAG.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tigris ${TAG#v}" \
            --notes-file "docs/releases/$TAG.md" --latest
      - name: Erase signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tigris.keystore"
